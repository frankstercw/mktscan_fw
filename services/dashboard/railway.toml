# Optional — see services/scheduler/railway.toml. Both services now build the
# same root Dockerfile; MKTSCAN_ROLE decides which one a container becomes.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "dashboard/**", "mktscan/**", "scripts/**",
  "requirements*.txt", "Dockerfile", "config.yaml",
]

[deploy]
startCommand = "./scripts/start.sh"
# Streamlit's own health endpoint, not "/" — "/" returns the SPA shell before
# the app is ready, so Railway would mark the service healthy too early.
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
numReplicas = 1
