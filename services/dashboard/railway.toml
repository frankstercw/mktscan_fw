# Point the service at this file via
#   Settings → Config-as-code → Railway Config File = /services/dashboard/railway.toml
# The absolute path is required: Railway only auto-detects railway.toml at the
# repo root, and the config path does not follow the Root Directory setting.
# Values here override the dashboard UI.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "dashboard/**",
  "mktscan/**",
  "scripts/start-dashboard.sh",
  "requirements*.txt",
  "Dockerfile",
  "config.yaml",
]

[deploy]
startCommand = "./scripts/start-dashboard.sh"
# Streamlit's own health endpoint, not "/" — "/" returns the SPA shell before the
# app is actually ready, so Railway would mark the service healthy too early.
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
numReplicas = 1
