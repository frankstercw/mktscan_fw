# Optional. The recommended setup no longer needs this file: both services build
# the root Dockerfile and differ only by the MKTSCAN_ROLE environment variable.
#
# Kept for anyone who prefers config as code. To use it, set
#   Settings → Config-as-code → Railway Config File = /services/scheduler/railway.toml
# (absolute path required — Railway only auto-detects railway.toml at the repo
# root, and the config path does not follow the Root Directory setting).

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "mktscan/**", "migrations/**", "scripts/**",
  "requirements*.txt", "Dockerfile", "alembic.ini", "config.yaml",
]

[deploy]
startCommand = "./scripts/start.sh"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
# Must stay at 1. Two schedulers would double every scrape; the per-day unique
# constraints stop duplicate rows, but both replicas would still hit Yahoo on
# the same cadence and invite rate limiting.
numReplicas = 1
